name: CPU correctness
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q --junitxml=pytest.xml
      - run: python -m protein_jepa.cli demo --config configs/smoke.yaml --output /tmp/protein-jepa-ci --length 32 --count 4
      - run: python -m protein_jepa.cli demo --config configs/effdock_smoke.yaml --output /tmp/jepa-effdock-ci --length 32 --count 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-results-${{ matrix.python }}
          path: pytest.xml
