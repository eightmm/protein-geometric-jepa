name: CuEq CPU and EFF-Dock blocks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cueq-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cueq-naive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]' 'cuequivariance==0.9.0' 'cuequivariance-torch==0.9.0'
      - name: Verify actual CuEq import (missing packages must fail this job)
        run: |
          mkdir -p reports/ci
          python -c "import cuequivariance, cuequivariance_torch; import importlib.metadata as m; print({n:m.version(n) for n in ['torch','cuequivariance','cuequivariance-torch']})"
          python -m pip freeze > reports/ci/environment.txt
      - run: python -m pytest -q --junitxml=reports/ci/pytest.xml
      - run: python -m protein_jepa.cli demo --config configs/effdock_naive.yaml --output runs/cueq-smoke --length 32 --count 4
      - run: python scripts/validate_crop_sizes.py --config configs/effdock_naive.yaml --lengths 128 256 --output reports/ci/crop_validation.json
      - name: Two-rank actual CuEq CPU DDP
        run: torchrun --standalone --nproc_per_node=2 -m protein_jepa.cli demo --config configs/effdock_naive.yaml --output runs/cueq-ddp --length 24 --count 4
      - run: python scripts/compare_geometry_blocks.py --backend cueq-naive --lengths 32 --repeats 2 --output reports/ci/cost.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cueq-naive-validation
          path: |
            reports/ci/
            runs/cueq-smoke/summary.json
            runs/cueq-smoke/metrics.jsonl
            runs/cueq-ddp/summary.json
