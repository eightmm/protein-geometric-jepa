# v0.2 EFF-Dock-inspired SO(3) JEPA; new weights required.
model:
  backend: cueq-naive
  scalar: 16
  vector: 4
  tensor: 2
  sequence_width: 32
  sequence_layers: 1
  atom_layers: 1
  backbone_layers: 1
  aa_layers: 1
  internal_layers: 1
  latent_scalar: 16
  latent_vector: 4
  latent_tensor: 2
  circular_channels: 4
  geometry_block: effdock
  eff_aggregation: soft
  eff_conditional: true
  eff_residual_scale: 0.1
  eff_radial_hidden: 24
  eff_edge_dim: 8
training:
  steps: 18
  batch_size: 1
  crop_lengths:
  - 16
  - 24
  device: cpu
  log_every: 1
