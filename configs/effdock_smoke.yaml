# Synthetic functional smoke; NOT a trained model or benchmark.
model:
  predictor_layers: 2
  atom_decoder_layers: 1
  scalar: 16
  vector: 4
  tensor: 2
  sequence_width: 32
  sequence_layers: 1
  heads: 4
  atom_layers: 1
  backbone_layers: 1
  aa_layers: 1
  internal_layers: 1
  backend: reference
  interaction: effdock
  effdock_radial_hidden: 24
  effdock_aggregation: soft
  effdock_expansion: 2
training:
  # 18-step smoke: a 0.996 teacher would barely move.
  ema: 0.9
  ema_end: 0.99
  mask_min_span: 2
  steps: 18
  batch_size: 1
  crop_lengths:
  - 16
  - 24
  learning_rate: 0.0003
  device: cpu
  log_every: 1
  save_every: 9
  threads: 1
