# Actual CuEq operations through its PyTorch naive method. Install .[cueq].
model:
  predictor_layers: 2
  atom_decoder_layers: 1
  backend: cueq-naive
  scalar: 16
  vector: 4
  tensor: 2
  sequence_width: 32
  sequence_layers: 1
  atom_layers: 1
  backbone_layers: 1
  aa_layers: 1
  internal_layers: 1
training:
  # 18-step smoke: a 0.996 teacher would barely move.
  ema: 0.9
  ema_end: 0.99
  mask_min_span: 2
  steps: 18
  batch_size: 1
  crop_lengths: [16, 24]
  device: cpu
  log_every: 1
