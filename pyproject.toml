[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "protein-geometric-jepa"
version = "0.2.0"
description = "Node-wise sequence / backbone / sidechain multi-view geometric JEPA research implementation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["torch>=2.2,<3", "numpy>=1.26,<3", "PyYAML>=6", "biopython>=1.83"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
cueq = ["cuequivariance>=0.9,<0.10", "cuequivariance-torch>=0.9,<0.10"]

[project.scripts]
protein-jepa = "protein_jepa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["cueq: requires cuEquivariance", "cuda: requires CUDA GPU"]

[tool.ruff]
line-length = 100
